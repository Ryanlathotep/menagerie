name: Build Lovable App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Install missing bug-report packages
        run: npm install html-to-image

      - name: Force Vite Build (Relative Paths for itch.io)
        run: |
          export VITE_SUPABASE_URL="https://ijhisspxewnmriuewaxs.supabase.co"
          export VITE_SUPABASE_PUBLISHABLE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqaGlzc3B4ZXdubXJpdWV3YXhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkzODE3MDMsImV4cCI6MjA4NDk1NzcwM30.X9LQKEOkhckY5d3P7HWvxvvqHKctQU9CuegZgW85_zI"
          export CI=false
          npx vite build --outDir actual_dist --base ./

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: lovable-itch-build
          path: actual_dist/

      - name: Install Butler
        run: |
          set -euo pipefail
          curl -L -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
          ./butler -V

      - name: Verify Butler credentials
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::error::BUTLER_API_KEY secret is missing. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          ./butler status maligore/menagerie:html5 || {
            echo "::error::Butler could not talk to itch.io. Key is likely invalid or lacks upload permission."
            exit 1
          }

      - name: Push build to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          ./butler push actual_dist maligore/menagerie:html5 \
            --userversion "${GITHUB_SHA::7}-$(date -u +%Y%m%d-%H%M)"

#
      - name: Generate release highlights
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          TAG="v$(date -u +%Y.%m.%d-%H%M)"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_LABEL=${GITHUB_SHA::7}-$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..HEAD"; else RANGE=$(git rev-list --max-parents=0 HEAD | head -1)..HEAD; fi
          mkdir -p docs/releases
          NOTES="docs/releases/${TAG}.md"
          {
            echo "## Menagerie $TAG"
            echo
            echo "Build \`${GITHUB_SHA::7}\` — playable at https://maligore.itch.io/menagerie and https://menagerie.lovable.app"
            echo
            echo "### Changes"
            git log --no-merges --pretty='- %s' "$RANGE" \
              | grep -viE '^- (Changes|wip|merge|bump|lint|format)$' \
              | head -20 || echo "- Stability and polish pass"
            echo
            echo "### Under the hood"
            echo "- Internal refactors, QA fixtures, and build tuning."
          } > "$NOTES"
          cat "$NOTES"

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "Menagerie $TAG" \
            --notes-file "docs/releases/${TAG}.md" \
            --target "$GITHUB_SHA" || \
          gh release edit "$TAG" --notes-file "docs/releases/${TAG}.md"
          echo "itch.io build label: $BUILD_LABEL"

      - name: Upload release notes artifact (for itch.io devlog paste)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: docs/releases/
