name: Build Lovable App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # TSC_COMPILE_ON_ERROR forces TypeScript to build despite errors
        # CI=false stops warnings from being treated as fatal build failures
        run: |
          export TSC_COMPILE_ON_ERROR=true
          export CI=false
          npm run build

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: lovable-itch-build
          path: dist/
