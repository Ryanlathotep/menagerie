name: Build Lovable App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build project
        run: |
          export VITE_SUPABASE_URL="https://supabase.co"
          export VITE_SUPABASE_ANON_KEY="placeholder-key"
          export CI=false
          npx vite build || true

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: lovable-itch-build
          # This search pattern finds index.html wherever Vite built it
          path: |
            **/dist/**
            **/build/**
            **/public/**
