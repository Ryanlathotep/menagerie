name: Build Lovable App

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps forces installation even if packages mismatch
        run: npm install --legacy-peer-deps

      - name: Build project
        # This injects dummy database variables to satisfy Vite's compiler rules
        run: |
          export VITE_SUPABASE_URL="https://supabase.co"
          export VITE_SUPABASE_ANON_KEY="placeholder-key"
          export CI=false
          npx vite build --warnOnly || npx vite build
        continue-on-error: true

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: lovable-itch-build
          path: |
            dist/
            build/
